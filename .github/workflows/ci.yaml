name: Build, publish and test Docker image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI_IMAGE_PROJECT: zz-test-forgejo-ui-ci-${{ github.run_id }}
      FORGEJO_SERVER_URL: https://ghcr.io
      FORGEJO_REPOSITORY: ${{ github.repository }}
      FORGEJO_REF: ${{ github.ref }}
      FORGEJO_EVENT_NAME: ${{ github.event_name }}
      RELEASE_IMAGE: ${{ vars.RELEASE_IMAGE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Check registry credentials before building
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-image.mjs validate-main
      - name: Build the patched Forgejo image
        run: node scripts/ci-image.mjs build
      - name: Publish the commit image (not yet tested)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-image.mjs candidate-main
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and unit tests
        run: |
          npm run check
          npm run check:automation
          npm run check:docs
      - name: Check patches against a clean pinned upstream checkout
        run: npm run check:patches
      - name: Test native SPA routes
        run: npm run test:go
      - name: Native integration, browser regression, accessibility and visuals
        run: npm run test:ci
      - name: Promote the tested image to main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-image.mjs publish-main
      - name: Retain comparison images on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-comparisons
          path: playwright-results/**/*.png
          retention-days: 7
      - name: Remove the isolated build container and volume
        if: always()
        run: node scripts/ci-image.mjs cleanup
